<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mosaiq QR Studio</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0b0b0f;color:#f2f2f2;font-family:Segoe UI,system-ui,sans-serif;text-align:center}
    .card{padding:32px 24px;max-width:420px}
    h1{font-size:28px;margin:0 0 8px}
    p{color:#a1a1aa;margin:0 0 24px}
    a.btn{display:inline-block;padding:12px 24px;border-radius:10px;background:#0078d4;
      color:#fff;text-decoration:none;font-weight:600;margin:6px}
    a.alt{background:transparent;border:1px solid #3f3f46}
  </style>
</head>
<body>
  <div class="card">
    <h1>Mosaiq QR Studio</h1>
    <p>Opening the Microsoft Store…</p>
    <a class="btn" href="ms-windows-store://pdp/?productid=9N8FWDL6NF60">Open in Microsoft Store</a>
    <a class="btn alt" href="https://apps.microsoft.com/detail/9N8FWDL6NF60">View on the web</a>
  </div>
  <script>
    var app = "ms-windows-store://pdp/?productid=9N8FWDL6NF60";
    var web = "https://apps.microsoft.com/detail/9N8FWDL6NF60";
    if (/Windows/i.test(navigator.userAgent)) {
      window.location.href = app;
    } else {
      window.location.replace(web);
    }
  </script>
</body>
</html>
